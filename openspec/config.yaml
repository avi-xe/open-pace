strict_tdd: true
context: |
  open-pace is a Quarkus-based federated Strava alternative built on ActivityPub.
  Tech stack: Quarkus 3.30.6, Java 21, PostgreSQL, Hibernate Panache, Flyway, Vert.x, Jackson.
  Test runner: Maven (`mvn test`) with Quarkus JUnit 5 + REST Assured.
  Test profile: H2 in-memory database for testing.
  Branching: Git Flow (main, develop, feature/sprint-N).
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "mvn test"
  verify:
    test_command: "mvn test"
testing:
  detected: "2026-08-08"
  runner:
    command: "mvn test"
    framework: "quarkus-junit5"
  layers:
    unit: "Entity tests with @TestTransaction"
    integration: "REST endpoint tests with UserTransaction + REST Assured"
    e2e: "Federation tests (planned)"
  commands:
    unit:
      - "mvn test -Dtest=*Test"
    integration:
      - "mvn test -Dtest=*ResourceTest"
    e2e: []
  coverage:
    command: ""
    commands: []
quality:
  lint: ""
  lint_commands: []
  typecheck: ""
  typecheck_commands: []
  format: ""
  format_commands: []
