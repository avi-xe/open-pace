# Test profile - use H2 in-memory database
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false

# OIDC disabled in tests
%test.quarkus.oidc.enabled=false

# Test identity - embedded user for Basic Auth in tests
# Note: plain-text is a BUILD-TIME property, cannot use %test. prefix
quarkus.security.users.embedded.plain-text=true
%test.quarkus.security.users.embedded.enabled=true
%test.quarkus.security.users.embedded.users.testuser=testuser
%test.quarkus.security.users.embedded.roles.testuser=user
%test.quarkus.http.auth.basic=true
