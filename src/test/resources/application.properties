# Test profile - use PostgreSQL with PostGIS (via Dev Services)
# H2 doesn't support geometry types, so tests need real PostGIS
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgis/postgis:17-3.4
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none
