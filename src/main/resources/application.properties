# Open Pace Configuration

# === Base URL ===
openpace.domain=localhost:8080
openpace.scheme=http

# === HTTP ===
quarkus.http.port=8080
quarkus.http.root-path=/

# === Database ===
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore

# Use PostGIS image for dev services
quarkus.datasource.devservices.image-name=postgis/postgis:17-3.4

# === Flyway ===
quarkus.flyway.migrate-at-start=true

# === Jackson ===
quarkus.jackson.write-dates-as-timestamps=false

# === Logging ===
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
quarkus.log.console.darken=1

# === Security ===
quarkus.http.auth.basic=true
quarkus.security.jpa.enabled=true

# === Federation ===
openpace.federation.webfinger.mode=remote
openpace.federation.webfinger.local-domain=localhost:8443

# === Dev overrides ===
#%dev.openpace.federation.webfinger.mode=local
#%dev.openpace.federation.webfinger.local-domain=localhost:8443
