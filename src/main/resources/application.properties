# Open Pace Configuration

# === Base URL ===
openpace.domain=localhost:8080
openpace.scheme=http

# === HTTP ===
quarkus.http.port=8080
quarkus.http.root-path=/

# === Database ===
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore

# === Flyway ===
quarkus.flyway.migrate-at-start=true

# === Jackson ===
quarkus.jackson.write-dates-as-timestamps=false

# === Logging ===
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
quarkus.log.console.darken=1

# === OIDC Security ===
# Default OIDC tenant (generic provider — override in %dev/%prod as needed)
quarkus.oidc.auth-server-url=${openpace.scheme}://${openpace.domain}/realms/master
quarkus.oidc.client-id=open-pace
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-redirect-path=/

# Session configuration
quarkus.http.auth.session.cookie.enabled=true
quarkus.http.auth.session.cookie.name=OPEN_PACE_SESSION
quarkus.http.auth.session.cookie.secure=false
quarkus.http.auth.session.cookie.same-site=lax

# Permission rules
quarkus.http.auth.permission.authenticated.paths=/api/auth/me,/api/users/*/outbox
quarkus.http.auth.permission.authenticated.policy=authenticated
